[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
[properties]
sys_root = '/opt/arm64'
pkg_config_libdir = ['/opt/arm64/usr/lib/aarch64-linux-gnu/pkgconfig']
needs_exe_wrapper = true
[built-in options]
c_args = ['--sysroot=/opt/arm64']
cpp_args = ['--sysroot=/opt/arm64']
c_link_args = ['--sysroot=/opt/arm64']
cpp_link_args = ['--sysroot=/opt/arm64']
